[package]
name = "primer_demux"
version = "0.0.4"
edition = "2024"
authors = ["adam <woshuishangpu@outlook.com>"]
description = "A high-performance tool for demultiplexing sequencing reads based on primer sequences using Myers algorithm."
license = "MIT"
repository = "https://github.com/huiN95/primer_demux"
homepage = "https://github.com/huiN95/primer_demux"
readme = "README.md"
keywords = ["bioinformatics", "demultiplexing", "sequencing", "primer"]
categories = ["science", "command-line-utilities"]

[dependencies]
log = "0.4.29"
env_logger = "0.11.5"
toml = "0.9.7"
bio = "3.0.0"
csv = "1"
anyhow = "1.0.102"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "chrono",
    "local-time",
] }
tracing-appender = "0.2"
crossbeam = "0.8"
indicatif = "0.18"
rust-htslib = "1.0.0"
seq_io = "0.3.4"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive", "env"] }

[profile.release]
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
