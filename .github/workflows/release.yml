name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhts-dev clang libclang-dev

      - name: Check package
        run: cargo publish --dry-run --locked

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  publish-anaconda:
    name: Publish to Anaconda.org
    runs-on: ubuntu-latest
    needs: publish-crates
    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          channels: conda-forge,bioconda,defaults

      - name: Install build dependencies
        shell: bash -l {0}
        run: |
          conda install -y conda-build anaconda-client
          sudo apt-get update
          sudo apt-get install -y libhts-dev clang libclang-dev

      - name: Build conda package
        shell: bash -l {0}
        run: |
          export LIBCLANG_PATH=/usr/lib/llvm-14/lib
          conda config --set anaconda_upload no
          conda build --output-folder ./conda-out ./conda-recipe

      - name: Upload to Anaconda.org
        shell: bash -l {0}
        env:
          BINSTAR_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_CLIENT_FORCE_STANDALONE: "true"
        run: |
          mapfile -t packages < <(find ./conda-out -type f \( -name "*.tar.bz2" -o -name "*.conda" \))
          test ${#packages[@]} -gt 0
          anaconda upload --user huiN95 --force "${packages[@]}"